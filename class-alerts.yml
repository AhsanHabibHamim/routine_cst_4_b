name: class-alerts
on:
  schedule:
    - cron: "0 0 * * *"   # 06:00 Dhaka time, every day (script skips Fri/Sat)
  workflow_dispatch:
jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/schedule-alerts.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
